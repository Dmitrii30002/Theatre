name: theater-api

services:
  api-gateway:
    build:
      context: ../backend/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8080"
    environment:
      CONFIG_PATH: /app/config/config.yaml
    restart: unless-stopped
    networks:
      - theater-network

networks:
  theater-network:
    driver: bridge
